
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Formalar</title>
    <link rel="stylesheet" href="border.css">
    <style>
        .container {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 150px;
            height: 100px;
        }

        /* 1. Qırmızı düzbucaqlı */
        .qirmizi {
            background-color: #ff9999;
        }

        /* 2. Mavi oval */
        .mavi {
            background-color: #99ccff;
            border-radius: 50%;
        }

        /* 3. Yaşıl küncləri yuvarlaq */
        .yasil {
            background-color: #99ff99;
            border-radius: 50px;
        }

        /* 4. Sarı düzbucaqlı */
        .sari {
            background-color: #ffff99;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box qirmizi"></div>
        <div class="box mavi"></div>
        <div class="box yasil"></div>
        <div class="box sari"></div>
    </div>

</body>
</html>
